version: '3.8'

services:
  redis:
    image: redis:7.4.7
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A app.tasks beat --loglevel=info
    volumes:
      - .:/app
      - sessions:/app/sessions
    depends_on:
      - redis
    environment:
      - REDIS_URL=redis://redis:6379/0

  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A app.tasks worker --loglevel=info --pool=solo
    volumes:
      - .:/app
      - sessions:/app/sessions
    depends_on:
      - redis
    environment:
      - REDIS_URL=redis://redis:6379/0

  fastapi:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    volumes:
      - .:/app
      - sessions:/app/sessions
    ports:
      - "8000:8000"
    depends_on:
      - redis
    environment:
      - REDIS_URL=redis://redis:6379/0


volumes:
  redis_data:
  sessions: