version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: redis-aibot-develop
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  worker:
    build: .
    container_name: celery-worker-develop
    command: >
      celery -A app.tasks worker
      --loglevel=info
      --pool=solo
    depends_on:
      - redis
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - .:/app
      - ./sessions:/app/sessions
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  beat:
    build: .
    container_name: celery-beat-develop
    command: >
      celery -A app.tasks beat
      --loglevel=info
      --scheduler celery.beat.PersistentScheduler
    depends_on:
      - redis
      - worker
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - C_FORCE_ROOT=true
    volumes:
      - .:/app
      - ./sessions:/app/sessions
      - ./celerybeat-schedule:/celerybeat-schedule
    working_dir: /app
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  redis_data:
  celerybeat-schedule: